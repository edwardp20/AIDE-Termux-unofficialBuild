    // buildFeatures 保留 viewBinding，删掉 useAndroidx
    buildFeatures {
        viewBinding false
    }
    
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false  // !true → false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21  // 升级
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])  // compile → implementation
    api project(':app')  // 保留，不会循环依赖
    
    // 如果需要 Kotlin
    // api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.0"
}