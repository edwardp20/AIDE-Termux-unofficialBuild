apply plugin: 'com.android.application'

android {
    compileSdk 34  // 升级
    // buildToolsVersion 删掉，AGP 自动选
    
    defaultConfig {
        applicationId "com.aide.termux"
        namespace "com.aide.termux"
        minSdk 24
        targetSdk 34
        versionCode 1021
        versionName "0.119.0-beta.2"
    }
    
    /*signingConfigs {
